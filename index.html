<!doctype html>
<!--
  Página intermediária do player de vídeo (resource videoplayer, também
  reaproveitada pelo resource boombox).

  O YouTube exige um HTTP Referer de domínio válido para embeds (erro 153) e a
  origem cfx-nui-* do FiveM não passa nessa validação. Esta página precisa ser
  hospedada num domínio real (ex.: https://cdn.atmus.dev.br/player.html) — o
  iframe interno dela envia o referer desse domínio, que o YouTube aceita.

  Uso: player.html?v=<id do vídeo (11 caracteres)>&start=<segundos>&autoplay=<0|1>&clean=<0|1>&mute=<0|1>
  A URL hospedada é configurada em shared-side/shared.lua (PlayerUrl) de cada resource.

  Legendas (cc_load_policy) ficam sempre desligadas — sem isso, vídeo com
  legenda forçada pelo autor mostra o texto por cima mesmo sem o usuário pedir.

  mute=1 é só pra quem usa esta página como TEXTURA visual muda (DUI da
  screentv) — o som já sai por outro canal (NUI com volume por distância), e
  sem mute a política de autoplay do Chromium bloqueia o autoplay sem gesto do
  usuário, prendendo o player no aviso de "clique pra ativar o som" (o botão
  de play/pause que não desaparece, já que a textura não recebe clique).
  boombox/videoplayer usam este player como fonte de áudio de verdade e não
  devem passar mute=1.

  clean=1 recarrega o vídeo parado assim que ele termina. Serve pra quem mostra o
  player pra uma pessoa olhando (o jornal da rede social): no fim do vídeo o Youtube
  cobre a tela inteira com a grade de "mais vídeos", e não existe parâmetro que
  desligue isso — recarregar devolve a capa limpa. Fica de fora por padrão porque a
  TV e a boombox querem o comportamento normal.

  Mensagem (postMessage) aceita do pai, além do carregamento via querystring:
    { Action: "Command", Func, Args } — repassa um comando (ex.: setVolume) pro
                                         player do Youtube via postMessage
  Isso é usado pelo boombox pra ajustar volume em tempo real conforme a distância,
  sem precisar recarregar o iframe a cada movimento do jogador.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Network</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <script>
      var Frame = null;
      var Playing = "";

      function LoadVideo(Id, Start, Autoplay) {
        Id = (Id || "").replace(/[^\w-]/g, "");
        if (Id.length !== 11) {
          return;
        }

        var Params = new URLSearchParams({
          autoplay: Autoplay === false || Autoplay === "0" ? "0" : "1",
          controls: "0",
          disablekb: "1",
          rel: "0",
          modestbranding: "1",
          iv_load_policy: "3",
          cc_load_policy: "0",
          playsinline: "1",
          enablejsapi: "1",
          origin: location.origin,
          start: String(parseInt(Start, 10) || 0),
          mute: Mute ? "1" : "0",
        });

        if (Frame) {
          Frame.remove();
        }

        Playing = Id;

        Frame = document.createElement("iframe");
        Frame.allow = "autoplay; encrypted-media; picture-in-picture";
        Frame.src = "https://www.youtube.com/embed/" + Id + "?" + Params;

        // Sem este aviso o player do Youtube não manda evento nenhum de volta, e é por
        // eles que se sabe que o vídeo acabou.
        if (Clean) {
          Frame.addEventListener("load", function () {
            Frame.contentWindow.postMessage(
              JSON.stringify({ event: "listening", id: 1, channel: "widget" }),
              "*",
            );
          });
        }

        document.body.appendChild(Frame);
      }

      var Initial = new URLSearchParams(location.search);
      var Clean = Initial.get("clean") === "1";
      var Mute = Initial.get("mute") === "1";

      LoadVideo(Initial.get("v"), Initial.get("start"), Initial.get("autoplay"));

      window.addEventListener("message", function (event) {
        var Data = event.data;
        if (typeof Data === "string") {
          try {
            Data = JSON.parse(Data);
          } catch (e) {
            return;
          }
        }

        if (!Data) {
          return;
        }

        // Fim do vídeo (estado 0). O Youtube manda isso de dois jeitos dependendo da
        // versão do player, então os dois são aceitos — e só de mensagem que veio dele.
        if (Clean && String(event.origin).indexOf("youtube.com") >= 0) {
          var State = Data.event === "onStateChange" ? Data.info : Data.info && Data.info.playerState;

          if (State === 0 && Playing) {
            // Recarrega parado: volta pra capa do vídeo em vez da grade de sugestões.
            LoadVideo(Playing, 0, "0");
            return;
          }
        }

        if (Data.Action !== "Command" || !Frame || !Frame.contentWindow) {
          return;
        }

        // "*" em vez de "https://www.youtube.com": logo depois de trocar o
        // src do iframe, o contentWindow ainda reporta a origem da PRÓPRIA
        // página (income.ind.br) até a navegação pro Youtube terminar — com
        // alvo fixo isso derruba a mensagem com "target origin does not
        // match" nesse intervalo. O player do Youtube não valida event.origin
        // pra aceitar esses comandos, então "*" é seguro aqui.
        Frame.contentWindow.postMessage(
          JSON.stringify({ event: "command", func: Data.Func, args: Data.Args || [] }),
          "*",
        );
      });
    </script>
  </body>
</html>
